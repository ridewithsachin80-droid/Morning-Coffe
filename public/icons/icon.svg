<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Moody Dark Background Glow -->
    <radialGradient id="moodyBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#221D1A" />
      <stop offset="55%" stop-color="#120E0C" />
      <stop offset="100%" stop-color="#060404" />
    </radialGradient>

    <!-- Warm Oak Wood Board Texture Gradients -->
    <linearGradient id="woodSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B88A58" />
      <stop offset="50%" stop-color="#966B3D" />
      <stop offset="100%" stop-color="#6E4A25" />
    </linearGradient>

    <linearGradient id="woodEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E4A25" />
      <stop offset="100%" stop-color="#422B14" />
    </linearGradient>

    <!-- Smooth Natural White Ceramic Cup Gradients -->
    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F5F0EB" />
      <stop offset="85%" stop-color="#DDD4CA" />
      <stop offset="100%" stop-color="#B3A798" />
    </linearGradient>

    <!-- Rich Dark Espresso Liquid Surface -->
    <radialGradient id="espressoLiquid" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#5B3720" />
      <stop offset="50%" stop-color="#381D0E" />
      <stop offset="85%" stop-color="#1F0E06" />
      <stop offset="100%" stop-color="#0C0502" />
    </radialGradient>

    <!-- Roasted Coffee Bean Texture -->
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#402315" />
      <stop offset="60%" stop-color="#261208" />
      <stop offset="100%" stop-color="#100602" />
    </linearGradient>

    <!-- Subtle UpScale Signature Glow -->
    <linearGradient id="upscaleGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E24AA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Realistic Soft Shadow Filters -->
    <filter id="naturalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="softSteamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#moodyBg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#F5F0EB" stroke-opacity="0.08" stroke-width="1.5" />

  <g transform="translate(0, 10)" filter="url(#naturalShadow)">

    <!-- Gentle Realistic Steam Wisps -->
    <g stroke="#F5F0EB" stroke-linecap="round" fill="none" opacity="0.32" filter="url(#softSteamGlow)">
      <path d="M 215 130 C 205 100 230 85 218 55" stroke-width="3" />
      <path d="M 256 120 C 238 82 268 70 252 35" stroke-width="4.5" opacity="0.5" />
      <path d="M 292 130 C 282 100 305 85 292 55" stroke-width="3" />
    </g>

    <!-- 1. Wooden Cutting Board Block Base -->
    <g>
      <!-- Wood Board Surface -->
      <polygon points="80,310 432,310 392,365 40,365" fill="url(#woodSurface)" />
      <!-- Wood Board Front Edge Thickness -->
      <polygon points="40,365 392,365 392,385 40,385" fill="url(#woodEdge)" />
      <!-- Board Top Surface Grain Highlights -->
      <path d="M 90 320 Q 256 325 410 320" fill="none" stroke="#E6C59E" stroke-width="1" opacity="0.25" />
      <path d="M 70 340 Q 256 345 398 340" fill="none" stroke="#E6C59E" stroke-width="1" opacity="0.2" />
    </g>

    <!-- 2. Contact Shadows for Cup and Beans -->
    <ellipse cx="236" cy="312" rx="95" ry="18" fill="#0A0604" opacity="0.8" />

    <!-- 3. Scattered Roasted Coffee Beans on Board and Table -->
    <g>
      <!-- Bean on Board Left -->
      <g transform="translate(110, 335) rotate(-30)">
        <path d="M -14 -8 C -21 8 8 18 17 4 C 22 -7 -2 -16 -14 -8 Z" fill="url(#beanGrad)" stroke="#0C0502" stroke-width="1" />
        <path d="M -9 -1 C -1 3 5 2 10 6" fill="none" stroke="#5B3720" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <g transform="translate(138, 348) rotate(15)">
        <path d="M -12 -7 C -18 7 7 15 15 3 C 20 -6 -2 -14 -12 -7 Z" fill="url(#beanGrad)" stroke="#0C0502" stroke-width="1" />
        <path d="M -8 -1 C 0 2 4 1 8 5" fill="none" stroke="#5B3720" stroke-width="1.2" stroke-linecap="round" />
      </g>

      <!-- Bean on Board Right -->
      <g transform="translate(340, 338) rotate(40)">
        <path d="M -15 -8 C -22 8 9 19 18 4 C 24 -7 -2 -17 -15 -8 Z" fill="url(#beanGrad)" stroke="#0C0502" stroke-width="1" />
        <path d="M -10 -1 C -1 3 5 1 11 6" fill="none" stroke="#5B3720" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Bean Foreground Table Bottom Right -->
      <g transform="translate(380, 395) rotate(-15)">
        <path d="M -16 -9 C -24 9 10 21 20 5 C 26 -8 -2 -19 -16 -9 Z" fill="url(#beanGrad)" stroke="#0C0502" stroke-width="1" />
        <path d="M -11 -2 C -2 3 5 1 12 7" fill="none" stroke="#5B3720" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <g transform="translate(410, 408) rotate(25)">
        <path d="M -13 -7 C -19 7 8 16 16 3 C 21 -6 -2 -15 -13 -7 Z" fill="url(#beanGrad)" stroke="#0C0502" stroke-width="1" />
        <path d="M -8 -1 C 0 2 5 1 9 5" fill="none" stroke="#5B3720" stroke-width="1.2" stroke-linecap="round" />
      </g>
    </g>

    <!-- 4. Natural Smooth White Ceramic Cup -->
    <!-- Ergonomic Ceramic Handle -->
    <path d="M 160 200 C 85 200 80 290 158 296 C 102 282 106 212 160 215 Z" 
          fill="url(#ceramicBody)" />

    <!-- Tapered Cup Body Silhouette -->
    <path d="M 152 182 L 174 300 C 178 322, 294 322, 298 300 L 320 182 Z" 
          fill="url(#ceramicBody)" />

    <!-- Soft Ceramic Shadow Contour -->
    <path d="M 174 300 C 178 322, 294 322, 298 300 L 320 182 C 290 200 182 200 152 182 Z" 
          fill="#000000" opacity="0.09" />

    <!-- Outer Precision Cup Rim -->
    <ellipse cx="236" cy="182" rx="84" ry="22" fill="url(#ceramicBody)" stroke="#FFFFFF" stroke-width="2" />

    <!-- Inner Dark Espresso Liquid Surface -->
    <ellipse cx="236" cy="182" rx="75" ry="17" fill="url(#espressoLiquid)" />

    <!-- Warm Golden Crema Ring Surface Highlight -->
    <ellipse cx="236" cy="182" rx="70" ry="14" fill="none" stroke="#D4A373" stroke-width="2" opacity="0.6" />

    <!-- 5. Subtle UpScale Sparkle Brand Seal Accent -->
    <g transform="translate(236, 362)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="url(#upscaleGlow)" opacity="0.9" filter="url(#softSteamGlow)" />
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="url(#upscaleGlow)" />
    </g>

  </g>
</svg>
