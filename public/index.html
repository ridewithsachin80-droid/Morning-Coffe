<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d1f0a">
<meta name="mobile-web-app-capable" content="yes">
<title>Morning Accounts ☕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#1a0a02;--roast:#3d1f0a;--mocha:#6b3a1f;
  --caramel:#c47a2b;--gold:#e8a93a;--cream:#f5e6c8;
  --latte:#f9f0dd;--milk:#fdf8f0;--white:#fff;
  --success:#2d7a4a;--danger:#b33a2a;--info:#1a56db;
  --shadow:0 4px 20px rgba(61,31,10,.15);
  --shadow-lg:0 8px 40px rgba(61,31,10,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--latte);color:var(--espresso);min-height:100vh;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--espresso),var(--roast) 60%,var(--mocha));padding:14px 18px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.4);}
.header-top{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.25rem;}
.header-sub{color:var(--cream);opacity:.7;font-size:.73rem;margin-top:1px;}
.header-right{text-align:right;}
.user-badge{background:rgba(255,255,255,.13);border-radius:20px;padding:3px 11px;color:var(--cream);font-size:.76rem;font-weight:500;margin-bottom:3px;display:inline-block;}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--cream);font-size:.7rem;padding:3px 10px;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-logout:hover{background:rgba(255,255,255,.15);}

/* NAV */
.nav{display:flex;background:var(--roast);overflow-x:auto;border-bottom:2px solid var(--mocha);}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{flex:1;min-width:60px;padding:10px 4px;border:none;background:transparent;color:var(--cream);opacity:.6;font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;}
.nav-btn.active{opacity:1;color:var(--gold);border-bottom-color:var(--gold);}

/* PAGES */
.page{display:none;padding:14px;max-width:860px;margin:0 auto;}
.page.active{display:block;}

/* CARDS */
.card{background:var(--white);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(196,122,43,.1);}
.card-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--roast);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--cream);display:flex;align-items:center;justify-content:space-between;gap:8px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--caramel);color:var(--white);}
.btn-primary:hover{background:var(--mocha);}
.btn-danger{background:var(--danger);color:var(--white);}
.btn-success{background:var(--success);color:var(--white);}
.btn-ghost{background:var(--cream);color:var(--roast);border:1px solid var(--caramel);}
.btn-ghost:hover{background:var(--caramel);color:var(--white);}
.btn-sm{padding:5px 11px;font-size:.76rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* FORM */
.form-group{margin-bottom:12px;}
.form-label{display:block;font-size:.76rem;font-weight:600;color:var(--mocha);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.form-input,.form-select{width:100%;padding:9px 12px;border:1.5px solid var(--cream);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;background:var(--milk);color:var(--espresso);-webkit-appearance:none;}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--caramel);background:var(--white);}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--espresso),var(--roast) 50%,var(--mocha));padding:20px;}
#setupScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--espresso),var(--mocha));padding:20px;}
.login-card{background:var(--white);border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:var(--shadow-lg);}
.login-logo{text-align:center;margin-bottom:20px;}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--roast);}
.login-logo p{color:var(--mocha);font-size:.83rem;margin-top:3px;}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:14px 0;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--caramel);transition:all .15s;}
.pin-dot.filled{background:var(--caramel);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.pin-key{padding:13px;border:1.5px solid var(--cream);border-radius:10px;font-size:1.15rem;font-weight:600;background:var(--milk);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;color:var(--espresso);}
.pin-key:hover{background:var(--caramel);color:var(--white);border-color:var(--caramel);}
.pin-key.clr{color:var(--danger);}

/* ITEM QUICK-ADD GRID */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.item-btn{background:var(--milk);border:2px solid var(--cream);border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .2s;position:relative;}
.item-btn:hover{border-color:var(--caramel);background:#fffbf0;transform:translateY(-1px);box-shadow:var(--shadow);}
.item-btn:active{transform:scale(.96);}
.item-btn.selected{border-color:var(--caramel);background:#fff8ec;}
.item-btn-name{font-weight:600;font-size:.88rem;color:var(--espresso);margin-bottom:4px;}
.item-btn-rate{font-size:.76rem;color:var(--mocha);}
.item-qty-badge{position:absolute;top:-8px;right:-8px;background:var(--caramel);color:var(--white);border-radius:50%;width:22px;height:22px;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;display:none;}
.item-qty-badge.show{display:flex;}
.qty-ctrl{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--caramel);background:transparent;color:var(--caramel);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{background:var(--caramel);color:var(--white);}
.qty-val{min-width:24px;text-align:center;font-weight:700;font-size:.95rem;}

/* MY TAB */
.tab-entry{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--milk);border-radius:8px;margin-bottom:6px;border-left:3px solid var(--caramel);}
.tab-entry-info{flex:1;}
.tab-entry-name{font-weight:600;font-size:.9rem;}
.tab-entry-time{font-size:.72rem;color:var(--mocha);}
.tab-entry-amt{font-weight:700;color:var(--caramel);font-size:.9rem;margin:0 10px;}
.tab-entry-del{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:1rem;padding:4px;border-radius:4px;}
.tab-entry-del:hover{background:#fde8e8;}

/* ADMIN LIVE BOARD */
.member-tab-card{background:var(--white);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid rgba(196,122,43,.1);}
.member-tab-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.member-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--caramel),var(--gold));display:flex;align-items:center;justify-content:center;color:var(--white);font-weight:700;font-size:.88rem;flex-shrink:0;}
.member-tab-name{font-weight:700;font-size:.95rem;margin-left:10px;}
.member-tab-total{font-family:'Playfair Display',serif;color:var(--caramel);font-size:1.2rem;font-weight:700;}
.item-summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.83rem;border-bottom:1px solid var(--cream);}
.item-summary-row:last-child{border-bottom:none;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.stat-card{border-radius:12px;padding:14px;color:var(--white);box-shadow:var(--shadow);}
.sc1{background:linear-gradient(135deg,var(--roast),var(--mocha));}
.sc2{background:linear-gradient(135deg,var(--caramel),var(--gold));}
.sc3{background:linear-gradient(135deg,#2d7a4a,#1f5533);}
.sc4{background:linear-gradient(135deg,#5a3e2b,#8b5e3c);}
.stat-num{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;}
.stat-lbl{font-size:.7rem;opacity:.85;margin-top:2px;}

/* PAY BANNER */
.pay-banner{background:linear-gradient(135deg,var(--success),#1f5533);border-radius:14px;padding:18px;color:var(--white);margin-bottom:12px;box-shadow:var(--shadow-lg);}
.pay-banner h2{font-family:'Playfair Display',serif;color:#a8e6c0;margin-bottom:4px;font-size:1.2rem;}
.pay-banner-total{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;margin:8px 0;}
.pay-banner.paid{background:linear-gradient(135deg,#4a4a4a,#2a2a2a);}
.pay-banner.partial{background:linear-gradient(135deg,#c9860b,#8a5b00);}
.pay-row{display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;}
.pay-hist-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.08);}

/* BILL TABLE */
.bill-table{width:100%;border-collapse:collapse;font-size:.84rem;}
.bill-table th{background:var(--roast);color:var(--cream);padding:8px 12px;text-align:left;font-size:.74rem;letter-spacing:.3px;}
.bill-table td{padding:8px 12px;border-bottom:1px solid var(--cream);}
.bill-table tr:last-child td{border-bottom:none;}
.bill-table .total-row td{background:var(--cream);font-weight:700;color:var(--roast);}
.bill-table td:last-child,.bill-table th:last-child{text-align:right;}

/* HISTORY */
.hist-item{padding:12px 14px;background:var(--milk);border-radius:10px;margin-bottom:8px;border-left:4px solid var(--caramel);cursor:pointer;}
.hist-item.paid{border-left-color:var(--success);}
.hist-item.partial{border-left-color:#c9860b;}
.hist-date{font-weight:700;font-size:.9rem;}
.hist-meta{font-size:.75rem;color:var(--mocha);margin-top:2px;}
.hist-amt{font-family:'Playfair Display',serif;color:var(--caramel);font-size:1.1rem;font-weight:700;}

/* BADGES */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.71rem;font-weight:600;}
.badge-open{background:#fff3cd;color:#856404;}
.badge-paid{background:#d4edda;color:#155724;}
.badge-partial{background:#ffe0b2;color:#8a4b00;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,10,2,.75);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--white);border-radius:18px;padding:22px;width:100%;max-width:460px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--roast);margin-bottom:14px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}

/* RATE ROW (admin items) */
.rate-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--cream);}
.rate-row:last-child{border-bottom:none;}
.rate-input{width:76px;padding:6px 9px;text-align:center;border:1.5px solid var(--cream);border-radius:8px;font-size:.88rem;font-family:'DM Sans',sans-serif;background:var(--milk);}
.rate-input:focus{outline:none;border-color:var(--caramel);}

/* MEMBER CHIP */
.member-chip{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--milk);border-radius:10px;margin-bottom:7px;border:1px solid var(--cream);}

/* UTILS */
.flex{display:flex;}.flex-between{display:flex;justify-content:space-between;align-items:center;}.gap-8{gap:8px;}.gap-10{gap:10px;}
.divider{height:1px;background:var(--cream);margin:10px 0;}
.empty-state{text-align:center;padding:32px 16px;color:var(--mocha);}
.empty-state .icon{font-size:2.2rem;margin-bottom:8px;}
.text-muted{color:var(--mocha);font-size:.81rem;}
.bold{font-weight:700;}
.grand-total-lbl{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--caramel);font-weight:700;}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(196,122,43,.3);border-top-color:var(--caramel);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(249,240,221,.85);display:flex;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:10px;}
.loading-overlay .spinner{width:34px;height:34px;border-width:4px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--roast);color:var(--cream);padding:10px 20px;border-radius:30px;font-size:.86rem;font-weight:500;z-index:999;box-shadow:var(--shadow-lg);animation:toastIn .3s ease;pointer-events:none;white-space:nowrap;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.section-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mocha);margin-bottom:8px;}
.add-confirm-strip{background:#f0faf4;border:1.5px solid #a8d5b5;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;animation:toastIn .3s ease;}
.add-confirm-strip .check{color:var(--success);font-size:1.1rem;}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setupScreen" style="display:none;">
  <div class="login-card">
    <div class="login-logo"><h1>☕ Morning Accounts</h1><p>First-time Setup</p></div>
    <div class="form-group"><label class="form-label">Admin Name</label><input type="text" class="form-input" id="setupName" placeholder="Your name"></div>
    <div class="form-group"><label class="form-label">Admin PIN (4 digits)</label><input type="password" class="form-input" id="setupPin" maxlength="4" placeholder="••••" inputmode="numeric"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doSetup()">Create Admin Account</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="login-logo"><h1>☕ Morning Accounts</h1><p>Good morning! Enter your name &amp; PIN</p></div>
    <div class="form-group"><label class="form-label">Your Name</label><input type="text" class="form-input" id="loginName" placeholder="Enter your name" autocomplete="off"></div>
    <div class="form-label" style="margin-bottom:6px;">PIN</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="dot0"></div><div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div><div class="pin-dot" id="dot3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key" onclick="pinPress('0')" style="grid-column:2">0</button>
      <button class="pin-key clr" onclick="pinBackspace()">⌫</button>
    </div>
    <div id="loginError" style="color:var(--danger);font-size:.8rem;text-align:center;margin-top:8px;min-height:18px;"></div>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" style="display:none;">
  <div class="header">
    <div class="header-top">
      <div><h1>☕ Morning Accounts</h1><div class="header-sub" id="headerDate"></div></div>
      <div class="header-right">
        <div class="user-badge" id="userBadge"></div><br>
        <button class="btn-logout" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>

  <!-- MEMBER NAV -->
  <div class="nav" id="memberNav">
    <button class="nav-btn active" onclick="showPage('addItems')">➕ Add Items</button>
    <button class="nav-btn" onclick="showPage('myTab')">🧾 My Tab</button>
    <button class="nav-btn" onclick="showPage('liveBoard')">💰 Pay Shop</button>
    <button class="nav-btn" onclick="showPage('history')">📅 History</button>
  </div>

  <!-- ADMIN NAV -->
  <div class="nav" id="adminNav" style="display:none;">
    <button class="nav-btn active" onclick="showPage('liveBoard')">📋 Live Board</button>
    <button class="nav-btn" onclick="showPage('addItems')">➕ Add Items</button>
    <button class="nav-btn" onclick="showPage('members')">👥 Members</button>
    <button class="nav-btn" onclick="showPage('adminItems')">🍵 Items</button>
    <button class="nav-btn" onclick="showPage('history')">📅 History</button>
  </div>

  <!-- ══ ADD ITEMS (member & admin) ══ -->
  <div class="page active" id="page-addItems">
    <div class="card">
      <div class="card-title">
        <span>📅 Date</span>
        <input type="date" class="form-input" id="addDate" style="width:auto;padding:5px 10px;font-size:.82rem;">
      </div>
      <div id="sessionStatusBanner"></div>
    </div>

    <div class="card">
      <div class="card-title">☕ What did you take?</div>
      <div class="item-grid" id="quickItemGrid"></div>
      <div class="divider"></div>
      <div class="flex-between" style="margin-bottom:12px;">
        <span class="text-muted">Adding total</span>
        <span class="grand-total-lbl" id="addTotal">₹0</span>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;font-size:.95rem;padding:12px;" onclick="submitItems()" id="addBtn">
        ✅ Add to My Tab
      </button>
    </div>

    <!-- Recent adds confirmation -->
    <div id="recentAdds"></div>
  </div>

  <!-- ══ MY TAB (member) ══ -->
  <div class="page" id="page-myTab">
    <div class="card">
      <div class="card-title flex-between">
        <span>🧾 My Tab</span>
        <div class="flex gap-8">
          <input type="date" class="form-input" id="myTabDate" style="width:auto;padding:5px 10px;font-size:.82rem;" onchange="loadMyTab()">
          <select class="form-input" id="myTabRoundSel" style="width:auto;padding:5px 10px;font-size:.82rem;" onchange="loadMyTab()"></select>
        </div>
      </div>
      <div id="myTabContent"></div>
    </div>
  </div>

  <!-- ══ LIVE BOARD (admin) ══ -->
  <div class="page" id="page-liveBoard">

    <div id="liveBoardDate" class="flex-between" style="margin-bottom:10px;">
      <div class="flex gap-8" style="align-items:center;">
        <input type="date" class="form-input" id="boardDate" style="width:auto;padding:6px 10px;font-size:.82rem;" onchange="loadLiveBoard()">
        <select class="form-input" id="boardRoundSel" style="width:auto;padding:6px 10px;font-size:.82rem;" onchange="loadLiveBoard()"></select>
        <button class="btn btn-ghost btn-sm" onclick="loadLiveBoard()">↺ Refresh</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="setToday()">Today</button>
    </div>

    <div id="payBanner"></div>

    <div class="stats-grid" id="boardStats"></div>

    <div id="liveBoardContent"></div>
  </div>

  <!-- ══ MEMBERS (admin) ══ -->
  <div class="page" id="page-members">
    <div class="card">
      <div class="card-title">➕ Add Member</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="flex:2;min-width:140px;margin-bottom:0;"><label class="form-label">Name</label><input type="text" class="form-input" id="newMemberName" placeholder="Full Name"></div>
        <div class="form-group" style="flex:1;min-width:90px;margin-bottom:0;"><label class="form-label">PIN (4 digits)</label><input type="password" class="form-input" id="newMemberPin" maxlength="4" placeholder="••••" inputmode="numeric"></div>
        <button class="btn btn-primary" onclick="addMember()">➕ Add</button>
      </div>
    </div>
    <div class="card"><div class="card-title">👥 Members</div><div id="memberList"></div></div>
  </div>

  <!-- ══ ADMIN ITEMS ══ -->
  <div class="page" id="page-adminItems">
    <div class="card">
      <div class="card-title">➕ Add Item</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="flex:2;min-width:140px;margin-bottom:0;"><label class="form-label">Name</label><input type="text" class="form-input" id="newItemName" placeholder="e.g. Samosa"></div>
        <div class="form-group" style="flex:1;min-width:90px;margin-bottom:0;"><label class="form-label">Rate (₹)</label><input type="number" class="form-input" id="newItemRate" placeholder="0" min="0"></div>
        <button class="btn btn-primary" onclick="addItem()">➕ Add</button>
      </div>
    </div>
    <div class="card"><div class="card-title">🍵 Menu Items</div><div id="itemsList"></div></div>

  <!-- ══ HISTORY (all members) ══ -->
  <div class="page" id="page-history">
    <div class="card"><div class="card-title">📅 Past Sessions</div><div id="historyList"></div></div>
  </div>

</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div style="color:var(--mocha);font-size:.88rem;">Loading…</div></div>

<script>
// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let currentUser = null;
let allItems    = [];
let addQtys     = {};  // { item_id: qty } for current selection
let pinBuffer   = '';
let editingMemberId = null;
let pendingPaySessionId = null;
let preselectSessionId  = null; // set by History to jump straight to a specific round

// ════════════════════════════════════════════════════════
// API
// ════════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

// ════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════
function todayStr() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) {
  if (!d) return '—';
  const s = String(d).substring(0,10);
  const [y,m,day] = s.split('-').map(Number);
  return new Date(y,m-1,day).toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}
function fmtTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function initials(name) { return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', dur);
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function confirm(title, body, cb, okLabel='Confirm', okClass='btn-success') {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent  = body;
  const btn = document.getElementById('confirmOkBtn');
  btn.className = `btn ${okClass}`;
  btn.textContent = okLabel;
  btn.onclick = () => { closeModal('confirmModal'); cb(); };
  openModal('confirmModal');
}
function loading(show) { document.getElementById('loadingOverlay').style.display = show?'flex':'none'; }

// ════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════
async function boot() {
  try {
    const s = await api('GET','/api/setup/status');
    if (!s.setupDone) { showSetup(); return; }
    const me = await api('GET','/api/me').catch(()=>null);
    if (me) { currentUser = me; await showApp(); return; }
    showLogin();
  } catch(e) { showLogin(); } finally { loading(false); }
}

// ════════════════════════════════════════════════════════
// SETUP
// ════════════════════════════════════════════════════════
function showSetup() {
  document.getElementById('setupScreen').style.display = 'flex';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display    = 'none';
}
async function doSetup() {
  const name = document.getElementById('setupName').value.trim();
  const pin  = document.getElementById('setupPin').value.trim();
  if (!name || pin.length < 4) { toast('Enter name and 4-digit PIN'); return; }
  try { await api('POST','/api/setup',{adminName:name,adminPin:pin}); showLogin(); toast('✅ Admin created! Log in now.'); }
  catch(e) { toast('Error: '+e.message); }
}

// ════════════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════════════
function showLogin() {
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display    = 'none';
  pinBuffer=''; updatePinDots();
}
function pinPress(d) {
  if (pinBuffer.length>=4) return;
  pinBuffer+=d; updatePinDots();
  if (pinBuffer.length===4) setTimeout(doLogin,180);
}
function pinBackspace() { pinBuffer=pinBuffer.slice(0,-1); updatePinDots(); }
function updatePinDots() {
  for(let i=0;i<4;i++) document.getElementById('dot'+i).classList.toggle('filled', i<pinBuffer.length);
}
async function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const err  = document.getElementById('loginError');
  err.textContent = '';
  if (!name) { err.textContent='Enter your name'; pinBuffer=''; updatePinDots(); return; }
  try {
    const d = await api('POST','/api/login',{name, pin:pinBuffer});
    currentUser = d; await showApp();
  } catch(e) { err.textContent=e.message; pinBuffer=''; updatePinDots(); }
}
document.addEventListener('keydown', e => {
  if (document.getElementById('loginScreen').style.display==='none') return;
  if (e.key>='0'&&e.key<='9') pinPress(e.key);
  if (e.key==='Backspace') pinBackspace();
});

// ════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════
async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('appShell').style.display    = 'block';

  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('userBadge').textContent =
    (currentUser.isAdmin?'⚙️ Admin: ':'👤 ')+currentUser.name;

  document.getElementById('memberNav').style.display = currentUser.isAdmin?'none':'flex';
  document.getElementById('adminNav').style.display  = currentUser.isAdmin?'flex':'none';

  allItems = await api('GET','/api/items');

  // Set dates
  const t = todayStr();
  document.getElementById('addDate').value = t;
  if (document.getElementById('myTabDate')) document.getElementById('myTabDate').value = t;
  if (document.getElementById('boardDate')) document.getElementById('boardDate').value = t;

  if (currentUser.isAdmin) { showPage('liveBoard'); }
  else                     { showPage('addItems'); }
}

async function logout() {
  await api('POST','/api/logout').catch(()=>{});
  currentUser=null; pinBuffer=''; showLogin();
}

// ════════════════════════════════════════════════════════
// NAV
// ════════════════════════════════════════════════════════
const PAGE_LOADERS = {
  addItems:   initAddItems,
  myTab:      loadMyTab,
  liveBoard:  loadLiveBoard,
  members:    loadMembers,
  adminItems: loadAdminItems,
  history:    loadHistory,
};
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if (b.getAttribute('onclick')?.includes(`'${name}'`)) b.classList.add('active');
  });
  if (PAGE_LOADERS[name]) PAGE_LOADERS[name]();
}

// ════════════════════════════════════════════════════════
// ADD ITEMS  (member quick-tap)
// ════════════════════════════════════════════════════════
function initAddItems() {
  addQtys = {};
  renderQuickGrid();
  loadSessionStatus();
  document.getElementById('recentAdds').innerHTML = '';
  document.getElementById('addDate').onchange = () => { loadSessionStatus(); };
}

async function loadSessionStatus() {
  const date = document.getElementById('addDate').value || todayStr();
  try {
    const sess = await api('GET',`/api/session/today?date=${date}`);
    const banner = document.getElementById('sessionStatusBanner');
    if (sess.status === 'open') {
      banner.innerHTML = `<div style="background:#fff3cd;border-radius:8px;padding:8px 14px;color:#856404;font-size:.82rem;">
        🟡 Round ${sess.round_no} open — add items anytime</div>`;
    } else if (sess.lastRound) {
      banner.innerHTML = `<div style="background:#ffe0b2;border-radius:8px;padding:8px 14px;color:#8a4b00;font-size:.82rem;">
        🟠 Round ${sess.lastRound.round_no} is settled — adding an item will start Round ${sess.round_no}</div>`;
    } else {
      banner.innerHTML = `<div style="background:#fff3cd;border-radius:8px;padding:8px 14px;color:#856404;font-size:.82rem;">
        🟡 Add your first item to start today's tab</div>`;
    }
    document.getElementById('addBtn').disabled = false;
  } catch(e) {}
}

function renderQuickGrid() {
  const grid = document.getElementById('quickItemGrid');
  grid.innerHTML = allItems.map(it => {
    const qty = addQtys[it.id] || 0;
    return `<div class="item-btn ${qty>0?'selected':''}" id="ibtn-${it.id}">
      <div class="item-btn-name">${it.name}</div>
      <div class="item-btn-rate">₹${parseFloat(it.rate).toFixed(0)}</div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeAddQty(${it.id},-1,event)">−</button>
        <div class="qty-val" id="addqval-${it.id}">${qty||0}</div>
        <button class="qty-btn" onclick="changeAddQty(${it.id},+1,event)">+</button>
      </div>
      <div class="item-qty-badge ${qty>0?'show':''}" id="addqbadge-${it.id}">${qty}</div>
    </div>`;
  }).join('');
  recalcAddTotal();
}

function changeAddQty(id, delta, e) {
  e && e.stopPropagation();
  const cur = addQtys[id]||0;
  const nxt = Math.max(0, cur+delta);
  addQtys[id] = nxt;
  document.getElementById('addqval-'+id).textContent    = nxt;
  const badge = document.getElementById('addqbadge-'+id);
  badge.textContent = nxt;
  badge.classList.toggle('show', nxt>0);
  document.getElementById('ibtn-'+id).classList.toggle('selected', nxt>0);
  recalcAddTotal();
}

function recalcAddTotal() {
  let total = 0;
  allItems.forEach(it => total += (addQtys[it.id]||0)*parseFloat(it.rate));
  document.getElementById('addTotal').textContent = '₹'+total.toLocaleString('en-IN');
}

async function submitItems() {
  const date    = document.getElementById('addDate').value || todayStr();
  const entries = allItems.filter(it=>(addQtys[it.id]||0)>0).map(it=>({item_id:it.id,qty:addQtys[it.id]}));
  if (!entries.length) { toast('Tap + on items you had'); return; }

  const total = allItems.reduce((s,it)=>s+(addQtys[it.id]||0)*parseFloat(it.rate),0);
  try {
    await api('POST','/api/tab',{date,entries});

    // Show confirmation strip
    const lines = entries.map(e=>{
      const it = allItems.find(i=>i.id===e.item_id);
      return `${it.name} ×${e.qty}`;
    }).join(', ');
    const strip = document.createElement('div');
    strip.className = 'add-confirm-strip card';
    strip.innerHTML = `<div><div class="bold">✅ Added to your tab</div><div class="text-muted">${lines}</div></div>
      <div class="bold" style="color:var(--caramel);">₹${total.toLocaleString('en-IN')}</div>`;
    const ra = document.getElementById('recentAdds');
    ra.insertBefore(strip, ra.firstChild);
    if (ra.children.length > 3) ra.removeChild(ra.lastChild);

    // Reset
    addQtys = {};
    renderQuickGrid();
    loadSessionStatus();
    toast('✅ Added!');
  } catch(e) { toast('Error: '+e.message); }
}

// ════════════════════════════════════════════════════════
// ROUND SELECTOR (shared by My Tab & Live Board — multiple sessions/day)
// ════════════════════════════════════════════════════════
async function populateRoundSelect(selectId, date) {
  const sel = document.getElementById(selectId);
  const prevValue = sel.value;
  let rounds = [];
  try { rounds = await api('GET', `/api/sessions/by-date?date=${date}`); } catch(e) { rounds = []; }

  if (!rounds.length) {
    sel.innerHTML = `<option value="">Round 1 (new)</option>`;
    return { sessionId: '', rounds: [] };
  }

  sel.innerHTML = rounds.map(r => {
    const tag = r.status === 'open' ? '🟡 open' : (r.status === 'partial' ? '🟠 partial' : '✅ paid');
    return `<option value="${r.id}">Round ${r.round_no} — ${tag}${r.grandTotal ? ' · ₹'+parseFloat(r.grandTotal).toLocaleString('en-IN') : ''}</option>`;
  }).join('');

  // Prefer an explicit preselect (from History), then the previous selection,
  // then the open round, then the latest round
  let target;
  if (preselectSessionId) {
    target = rounds.find(r => String(r.id) === String(preselectSessionId));
    preselectSessionId = null;
  }
  if (!target) target = rounds.find(r => String(r.id) === String(prevValue));
  if (!target) target = rounds.find(r => r.status === 'open') || rounds[rounds.length - 1];
  sel.value = target.id;
  return { sessionId: target.id, rounds };
}

// ════════════════════════════════════════════════════════
// MY TAB (member)
// ════════════════════════════════════════════════════════
async function loadMyTab() {
  const date = document.getElementById('myTabDate').value || todayStr();
  const cont = document.getElementById('myTabContent');
  cont.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const { sessionId } = await populateRoundSelect('myTabRoundSel', date);
    const q = sessionId ? `session_id=${sessionId}` : `date=${date}`;
    const { session, entries, total } = await api('GET',`/api/tab/mine?${q}`);
    if (!session || !entries.length) {
      cont.innerHTML = '<div class="empty-state"><div class="icon">🫙</div><p>Nothing added yet this round</p></div>';
      return;
    }
    const canDelete = session.status === 'open';
    cont.innerHTML = `
      ${entries.map(e=>`
        <div class="tab-entry" id="entry-${e.id}">
          <div class="tab-entry-info">
            <div class="tab-entry-name">${e.item_name} ×${e.qty}</div>
            <div class="tab-entry-time">${fmtTime(e.added_at)}</div>
          </div>
          <div class="tab-entry-amt">₹${parseFloat(e.amount).toFixed(0)}</div>
          ${canDelete?`<button class="tab-entry-del" onclick="deleteEntry(${e.id})" title="Remove">✕</button>`:''}
        </div>`).join('')}
      <div class="divider"></div>
      <div class="flex-between">
        <span class="bold">My Total (Round ${session.round_no})</span>
        <span class="grand-total-lbl">₹${total.toLocaleString('en-IN')}</span>
      </div>
      ${session.status==='paid'?`<div style="margin-top:8px;"><span class="badge badge-paid">✅ Paid by admin at ${fmtTime(session.paid_at)}</span></div>`:''}
      ${session.status==='partial'?`<div style="margin-top:8px;"><span class="badge badge-partial">🟠 Admin has started paying — round locked</span></div>`:''}`;
  } catch(e) { cont.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`; }
}

async function deleteEntry(id) {
  try {
    await api('DELETE',`/api/tab/${id}`);
    document.getElementById('entry-'+id)?.remove();
    toast('Removed');
  } catch(e) { toast('Error: '+e.message); }
}

// ════════════════════════════════════════════════════════
// LIVE BOARD (admin)
// ════════════════════════════════════════════════════════
function setToday() {
  document.getElementById('boardDate').value = todayStr();
  loadLiveBoard();
}

async function loadLiveBoard() {
  const date = document.getElementById('boardDate').value || todayStr();
  const cont  = document.getElementById('liveBoardContent');
  const stats = document.getElementById('boardStats');
  const pay   = document.getElementById('payBanner');
  cont.innerHTML  = '<div class="empty-state"><div class="spinner"></div></div>';
  stats.innerHTML = '';
  pay.innerHTML   = '';

  try {
    const { sessionId } = await populateRoundSelect('boardRoundSel', date);
    const q = sessionId ? `session_id=${sessionId}` : `date=${date}`;
    const { session, byMember, itemSummary, grandTotal, entryCount, payments, amountPaid, pending } = await api('GET',`/api/tab/all?${q}`);
    if (!session) {
      cont.innerHTML = '<div class="empty-state"><div class="icon">☕</div><p>No round yet for this date. It will start once someone adds an item.</p></div>';
      stats.innerHTML = '';
      return;
    }
    const memberCount = Object.keys(byMember).length;
    const isPaid    = session.status === 'paid';
    const isPartial = session.status === 'partial';
    const sid = session.id;

    // Pay banner
    if (isPaid) {
      pay.innerHTML = `<div class="pay-banner paid" style="margin-bottom:12px;">
        <h2>✅ Round ${session.round_no} Paid & Closed</h2>
        <div class="pay-banner-total">₹${parseFloat(grandTotal).toLocaleString('en-IN')}</div>
        <div style="font-size:.83rem;opacity:.8;">Paid on ${fmtDate(session.paid_at?.substring(0,10))} at ${fmtTime(session.paid_at)}</div>
        ${currentUser.isAdmin?`<button class="btn btn-ghost btn-sm" style="margin-top:10px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);" onclick="reopenSession(${sid})">↩️ Reopen This Round</button>`:''}
      </div>`;
    } else if (isPartial) {
      pay.innerHTML = `<div class="pay-banner partial" style="margin-bottom:12px;">
        <h2>🟠 Round ${session.round_no} — Partially Paid</h2>
        <div class="pay-banner-total">₹${pending.toLocaleString('en-IN')} <span style="font-size:.9rem;font-weight:400;opacity:.85;">pending</span></div>
        <div style="font-size:.83rem;opacity:.85;">₹${amountPaid.toLocaleString('en-IN')} paid of ₹${parseFloat(grandTotal).toLocaleString('en-IN')} bill</div>
        <button class="btn btn-success" style="margin-top:12px;width:100%;justify-content:center;font-size:.95rem;padding:12px;" onclick="openBillModal(${sid})">
          🧾 View Bill &amp; Pay Remaining
        </button>
        ${currentUser.isAdmin?`<button class="btn btn-ghost btn-sm" style="margin-top:8px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);" onclick="reopenSession(${sid})">↩️ Reopen This Round</button>`:''}
      </div>`;
    } else if (grandTotal > 0) {
      pay.innerHTML = `<div class="pay-banner" style="margin-bottom:12px;">
        <h2>☕ Round ${session.round_no} — Running Tab</h2>
        <div class="pay-banner-total">₹${parseFloat(grandTotal).toLocaleString('en-IN')}</div>
        <div style="font-size:.83rem;opacity:.8;">${entryCount} item(s) · ${memberCount} member(s)</div>
        <button class="btn btn-success" style="margin-top:12px;width:100%;justify-content:center;font-size:.95rem;padding:12px;" onclick="openBillModal(${sid})">
          🧾 View Bill &amp; Pay Coffee Shop
        </button>
      </div>`;
    }

    // Stats
    const statusLabel = isPaid ? 'Paid' : (isPartial ? 'Partial' : 'Open');
    const statusClass  = isPaid ? 'paid' : (isPartial ? 'partial' : 'open');
    stats.innerHTML = `
      <div class="stat-card sc1"><div class="stat-num">${memberCount}</div><div class="stat-lbl">👥 Members (Round ${session.round_no})</div></div>
      <div class="stat-card sc2"><div class="stat-num">₹${parseFloat(grandTotal).toLocaleString('en-IN')}</div><div class="stat-lbl">💰 Round total</div></div>
      <div class="stat-card sc3"><div class="stat-num">${entryCount}</div><div class="stat-lbl">📋 Items added</div></div>
      <div class="stat-card sc4"><div class="stat-num"><span class="badge badge-${statusClass}" style="font-size:.9rem;">${statusLabel}</span></div><div class="stat-lbl">📅 Status</div></div>`;

    if (!memberCount) {
      cont.innerHTML = '<div class="empty-state"><div class="icon">☕</div><p>No items added yet this round. Members will appear here as they add items.</p></div>';
      return;
    }

    // Member cards
    cont.innerHTML = Object.entries(byMember)
      .sort((a,b)=>b[1].total-a[1].total)
      .map(([name,data])=>{
        // Group entries by item
        const grouped = {};
        data.entries.forEach(e=>{
          if (!grouped[e.item_name]) grouped[e.item_name]={qty:0,amount:0,rate:e.rate};
          grouped[e.item_name].qty+=e.qty;
          grouped[e.item_name].amount+=parseFloat(e.amount);
        });
        return `<div class="member-tab-card">
          <div class="member-tab-header">
            <div class="flex gap-8" style="align-items:center;">
              <div class="member-avatar">${initials(name)}</div>
              <div class="member-tab-name">${name}</div>
            </div>
            <div class="member-tab-total">₹${data.total.toLocaleString('en-IN')}</div>
          </div>
          ${Object.entries(grouped).map(([iname,iv])=>`
            <div class="item-summary-row">
              <span>${iname} <span style="color:var(--mocha);">×${iv.qty}</span></span>
              <span class="bold">₹${iv.amount.toLocaleString('en-IN')}</span>
            </div>`).join('')}
        </div>`;
      }).join('');

  } catch(e) { cont.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`; }
}

// ════════════════════════════════════════════════════════
// BILL MODAL & PAY
// ════════════════════════════════════════════════════════
let pendingBillAmount = 0; // current pending balance for the open bill modal

async function openBillModal(sessionId) {
  pendingPaySessionId = sessionId;
  openModal('billModal');
  document.getElementById('billModalBody').innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  document.getElementById('payAmountInput').value = '';

  try {
    const { session, byMember, itemSummary, grandTotal, payments, amountPaid, pending } = await api('GET',`/api/tab/all?session_id=${sessionId}`);
    pendingBillAmount = pending;

    // Item summary for coffee shop
    const itemRows = Object.entries(itemSummary)
      .sort((a,b)=>b[1].amount-a[1].amount)
      .map(([name,v])=>`<tr>
        <td>${name}</td>
        <td style="text-align:center;">${v.qty}</td>
        <td>₹${parseFloat(v.rate).toFixed(0)}</td>
        <td>₹${parseFloat(v.amount).toLocaleString('en-IN')}</td>
      </tr>`).join('');

    // Member breakdown
    const memberRows = Object.entries(byMember)
      .sort((a,b)=>b[1].total-a[1].total)
      .map(([name,d])=>`<tr><td>${name}</td><td colspan="2"></td><td>₹${d.total.toLocaleString('en-IN')}</td></tr>`)
      .join('');

    // Payment history (partial payments already made)
    const payRows = (payments||[]).map(p=>{
      const canUndo = currentUser.isAdmin || p.paid_by === currentUser.memberId;
      return `
      <div class="pay-hist-row">
        <span>${fmtDate(p.paid_at.substring(0,10))} ${fmtTime(p.paid_at)} · ${p.paid_by_name||'—'}</span>
        <span class="flex gap-8" style="align-items:center;">
          <span class="bold">₹${parseFloat(p.amount).toLocaleString('en-IN')}</span>
          ${canUndo?`<button class="btn btn-ghost btn-sm" style="padding:2px 8px;" onclick="undoPayment(${p.id})">✕</button>`:''}
        </span>
      </div>`;
    }).join('');
    const payHistoryHtml = payments && payments.length ? `
      <div class="section-label" style="margin-top:14px;">Payments so far</div>
      ${payRows}` : '';

    document.getElementById('billModalBody').innerHTML = `
      <p style="font-size:.83rem;color:var(--mocha);margin-bottom:12px;">📅 ${fmtDate(String(session.date).substring(0,10))} · Round ${session.round_no}</p>
      <div class="section-label">Coffee Shop Bill (Items)</div>
      <table class="bill-table" style="margin-bottom:14px;">
        <thead><tr><th>Item</th><th style="text-align:center;">Qty</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>${itemRows}</tbody>
        <tfoot><tr class="total-row"><td colspan="3">Grand Total</td><td>₹${parseFloat(grandTotal).toLocaleString('en-IN')}</td></tr></tfoot>
      </table>
      <div class="section-label">Member Split</div>
      <table class="bill-table">
        <thead><tr><th>Member</th><th colspan="2"></th><th>Amount</th></tr></thead>
        <tbody>${memberRows}</tbody>
        <tfoot><tr class="total-row"><td colspan="3">Total</td><td>₹${parseFloat(grandTotal).toLocaleString('en-IN')}</td></tr></tfoot>
      </table>
      ${payHistoryHtml}
      <div class="divider"></div>
      <div class="pay-row"><span>Bill total</span><span>₹${parseFloat(grandTotal).toLocaleString('en-IN')}</span></div>
      <div class="pay-row"><span>Already paid</span><span>₹${amountPaid.toLocaleString('en-IN')}</span></div>
      <div class="flex-between"><span class="bold" style="font-size:1rem;">Pending balance</span>
        <span class="grand-total-lbl">₹${pending.toLocaleString('en-IN')}</span></div>`;

    document.getElementById('payAmountInput').value = pending > 0 ? pending : '';
    document.getElementById('payAmountInput').max = pending;
  } catch(e) {
    document.getElementById('billModalBody').innerHTML = `<p style="color:var(--danger);">${e.message}</p>`;
  }
}

function fillPayAmount(which) {
  const input = document.getElementById('payAmountInput');
  if (which === 'full') input.value = pendingBillAmount;
  else if (which === 'half') input.value = (Math.round((pendingBillAmount/2)*100)/100);
}

async function payNow() {
  if (!pendingPaySessionId) return;
  const raw = document.getElementById('payAmountInput').value;
  const amount = raw === '' ? undefined : parseFloat(raw);
  if (amount !== undefined && (isNaN(amount) || amount <= 0)) { toast('Enter a valid amount'); return; }
  try {
    const res = await api('POST','/api/tab/pay',{session_id:pendingPaySessionId, amount});
    closeModal('billModal');
    if (res.pending > 0) toast(`💰 ₹${res.amountPaid.toLocaleString('en-IN')} paid · ₹${res.pending.toLocaleString('en-IN')} still pending`);
    else toast('💰 Paid in full! Round closed — a new round starts automatically on the next item.');
    loadLiveBoard();
  } catch(e) { toast('Error: '+e.message); }
}

async function undoPayment(paymentId) {
  confirm('Undo Payment','Remove this payment record? This does not move any real money — only corrects the tab.',async()=>{
    try {
      await api('DELETE',`/api/tab/payments/${paymentId}`);
      toast('Payment removed');
      openBillModal(pendingPaySessionId);
      loadLiveBoard();
    } catch(e) { toast('Error: '+e.message); }
  },'Remove','btn-danger');
}

async function reopenSession(sessionId) {
  confirm('Reopen Round','Allow new items to be added to this round again?', async ()=>{
    try {
      await api('POST','/api/tab/reopen',{session_id:sessionId});
      toast('Round reopened');
      loadLiveBoard();
    } catch(e) { toast('Error: '+e.message); }
  },'Reopen','btn-primary');
}

// ════════════════════════════════════════════════════════
// MEMBERS
// ════════════════════════════════════════════════════════
async function loadMembers() {
  const list = document.getElementById('memberList');
  list.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const rows = await api('GET','/api/members');
    list.innerHTML = rows.map(m=>`
      <div class="member-chip">
        <div class="flex gap-8" style="align-items:center;">
          <div class="member-avatar">${initials(m.name)}</div>
          <div>
            <div style="font-weight:600;font-size:.9rem;">${m.name}
              ${m.is_admin?'<span class="badge" style="background:#e8d5ff;color:#5a0080;margin-left:5px;">Admin</span>':''}
              ${!m.is_active?'<span class="badge" style="background:#f8d7da;color:#721c24;margin-left:4px;">Inactive</span>':''}
            </div>
          </div>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-ghost btn-sm" onclick="openEditMember(${m.id},'${m.name.replace(/'/g,"\\'")}',${m.is_active})">✏️</button>
          ${!m.is_admin?`<button class="btn btn-danger btn-sm" onclick="deleteMember(${m.id},'${m.name.replace(/'/g,"\\'")}')">🗑️</button>`:''}
        </div>
      </div>`).join('') || '<div class="empty-state"><p>No members yet</p></div>';
  } catch(e) { list.innerHTML = `<p style="color:var(--danger);">${e.message}</p>`; }
}

async function addMember() {
  const name = document.getElementById('newMemberName').value.trim();
  const pin  = document.getElementById('newMemberPin').value.trim();
  if (!name||pin.length<4) { toast('Enter name and 4-digit PIN'); return; }
  try {
    await api('POST','/api/members',{name,pin});
    toast('✅ '+name+' added');
    document.getElementById('newMemberName').value='';
    document.getElementById('newMemberPin').value='';
    loadMembers();
  } catch(e) { toast('Error: '+e.message); }
}

function openEditMember(id, name, isActive) {
  editingMemberId=id;
  document.getElementById('editMemberName').value=name;
  document.getElementById('editMemberPin').value='';
  document.getElementById('editMemberActive').value=String(isActive);
  openModal('editMemberModal');
}
async function saveMemberEdit() {
  const name=document.getElementById('editMemberName').value.trim();
  const pin=document.getElementById('editMemberPin').value.trim();
  const isActive=document.getElementById('editMemberActive').value==='true';
  if (!name) { toast('Name required'); return; }
  try {
    await api('PUT',`/api/members/${editingMemberId}`,{name,pin:pin||undefined,is_active:isActive});
    toast('✅ Saved'); closeModal('editMemberModal'); loadMembers();
  } catch(e) { toast('Error: '+e.message); }
}
function deleteMember(id, name) {
  confirm('Remove Member',`Deactivate "${name}"?`,async()=>{
    await api('DELETE',`/api/members/${id}`);
    toast('Removed '+name); loadMembers();
  },'Remove','btn-danger');
}

// ════════════════════════════════════════════════════════
// ADMIN ITEMS
// ════════════════════════════════════════════════════════
async function loadAdminItems() {
  allItems = await api('GET','/api/items');
  const list = document.getElementById('itemsList');
  list.innerHTML = allItems.map(it=>`
    <div class="rate-row">
      <input class="form-input" style="flex:2;margin-right:8px;padding:6px 10px;" id="iname-${it.id}" value="${it.name}">
      <span style="color:var(--mocha);font-size:.83rem;margin-right:4px;">₹</span>
      <input type="number" class="rate-input" style="margin-right:8px;" id="irate-${it.id}" value="${parseFloat(it.rate).toFixed(0)}" min="0">
      <button class="btn btn-ghost btn-sm" onclick="saveItem(${it.id})">💾</button>
      <button class="btn btn-danger btn-sm" style="margin-left:5px;" onclick="deleteItem(${it.id},'${it.name.replace(/'/g,"\\'")}')">✕</button>
    </div>`).join('');
}
async function saveItem(id) {
  const name=document.getElementById('iname-'+id).value.trim();
  const rate=parseFloat(document.getElementById('irate-'+id).value)||0;
  if (!name) { toast('Name required'); return; }
  try { await api('PUT',`/api/items/${id}`,{name,rate,is_active:true}); toast('✅ Saved'); allItems=await api('GET','/api/items'); }
  catch(e) { toast('Error: '+e.message); }
}
async function addItem() {
  const name=document.getElementById('newItemName').value.trim();
  const rate=parseFloat(document.getElementById('newItemRate').value)||0;
  if (!name) { toast('Enter item name'); return; }
  try {
    await api('POST','/api/items',{name,rate});
    toast('✅ '+name+' added');
    document.getElementById('newItemName').value='';
    document.getElementById('newItemRate').value='';
    allItems=await api('GET','/api/items');
    loadAdminItems();
  } catch(e) { toast('Error: '+e.message); }
}
async function deleteItem(id, name) {
  confirm('Remove Item',`Remove "${name}"?`,async()=>{
    await api('DELETE',`/api/items/${id}`);
    toast('Removed '+name); allItems=await api('GET','/api/items'); loadAdminItems();
  },'Remove','btn-danger');
}

// ════════════════════════════════════════════════════════
// HISTORY
// ════════════════════════════════════════════════════════
async function loadHistory() {
  const list=document.getElementById('historyList');
  list.innerHTML='<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const rows=await api('GET','/api/sessions');
    if (!rows.length) { list.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>No sessions yet</p></div>'; return; }
    list.innerHTML=rows.map(s=>`
      <div class="hist-item ${s.status}" onclick="viewHistorySession('${String(s.date).substring(0,10)}', ${s.id})">
        <div class="flex-between">
          <div>
            <div class="hist-date">${fmtDate(String(s.date).substring(0,10))} ${s.round_no>1?`· Round ${s.round_no}`:''}</div>
            <div class="hist-meta">${s.member_count} member(s) · <span class="badge badge-${s.status}">${s.status}</span>${s.status==='partial'?` · ₹${parseFloat(s.pending).toLocaleString('en-IN')} pending`:''}</div>
          </div>
          <div class="hist-amt">₹${parseFloat(s.total).toLocaleString('en-IN')}</div>
        </div>
      </div>`).join('');
  } catch(e) { list.innerHTML=`<p style="color:var(--danger);">${e.message}</p>`; }
}

function viewHistorySession(date, sessionId) {
  preselectSessionId = sessionId;
  if (currentUser && currentUser.isAdmin) {
    document.getElementById('boardDate').value = date;
    showPage('liveBoard');
  } else {
    document.getElementById('myTabDate').value = date;
    showPage('myTab');
  }
}

loading(true);
boot();
</script>
